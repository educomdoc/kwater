<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>프로젝트 프리뷰 바로가기</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f7ff;
            color: #1e293b;
        }
        .card {
            background: white;
            padding: 2rem;
            border-radius: 1.5rem;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            text-align: center;
            max-width: 400px;
        }
        h1 { color: #2563eb; margin-bottom: 0.5rem; }
        p { color: #64748b; margin-bottom: 2rem; }
        .btn {
            display: inline-block;
            background-color: #2563eb;
            color: white;
            padding: 0.8rem 1.5rem;
            border-radius: 0.75rem;
            text-decoration: none;
            font-weight: bold;
            transition: transform 0.2s;
        }
        .btn:hover { transform: scale(1.05); background-color: #1d4ed8; }
        .status {
            margin-top: 1.5rem;
            font-size: 0.85rem;
            color: #10b981;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }
        .dot { width: 8px; height: 8px; background: #10b981; border-radius: 50%; }
    </style>
</head>
<body>
    <div class="card">
        <h1>🚀 개발 서버 실행 중</h1>
        <p>현재 Next.js 개발 서버가 성공적으로 시작되었습니다. 아래 버튼을 눌러 프로젝트를 확인하세요.</p>
        <a href="http://localhost:3000" target="_blank" class="btn">웹사이트 열기 (localhost:3000)</a>
        <div class="status">
            <div class="dot"></div>
            <span>개발 모드 활성화됨</span>
        </div>
    </div>
</body>
</html>
